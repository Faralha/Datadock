# ==========================================
# IDENTITAS PROJECT
# ==========================================
# projectKey/projectName ditimpa per environment oleh job sonar_check di .gitlab-ci.yml
sonar.projectKey=datadock
sonar.projectName=DataDock Control Plane
sonar.projectVersion=1.0

# ==========================================
# SUMBER KODE
# ==========================================
sonar.sources=control-plane/src,control-plane/web/src
sonar.tests=control-plane/test
sonar.sourceEncoding=UTF-8

# ==========================================
# 🧹 EXCLUSIONS (PEMBERSIHAN)
# ==========================================
# Komponen shadcn/ui adalah kode hasil generator (vendored), bukan kode tim
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/data/**,\
  control-plane/web/src/components/ui/**,\
  **/*.config.ts,\
  **/Dockerfile,\
  deploy.sh,\
  cleanup.sh,\
  spike/**

# ==========================================
# 🧪 TESTING & COVERAGE
# ==========================================
# `deploy.sh test` menulis coverage/lcov.info dengan path relatif ke root repo
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# File test dan script operasional tidak dihitung coverage-nya
sonar.coverage.exclusions=\
  control-plane/test/**,\
  control-plane/scripts/**,\
  control-plane/src/bootstrap.ts,\
  control-plane/src/purge.ts,\
  control-plane/src/index.ts,\
  control-plane/web/**

# Duplicate code detection exclusions
sonar.cpd.exclusions=\
  control-plane/test/**
