services:
  postgres:
    image: postgres:18.3
    container_name: spike-pg
    environment:
      POSTGRES_PASSWORD: rootpass
    ports: ["5432:5432"]
    volumes:
      # PG 18 image: mount di /var/lib/postgresql (bukan .../data), PGDATA ada di subfolder versi
      - pgdata:/var/lib/postgresql
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  mariadb:
    image: mariadb:12.2.2-noble
    container_name: spike-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
    ports: ["3306:3306"]
    volumes:
      - mariadata:/var/lib/mysql
      - backups:/backups
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 20

  mongo:
    image: mongo:8.0
    container_name: spike-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db
      - backups:/backups
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      retries: 20

  # Tambahan untuk host Windows: Docker Desktop tidak menyediakan unix socket di host,
  # jadi skrip spike dijalankan di container Linux (sama seperti server produksi)
  # dengan /var/run/docker.sock di-mount. Host engine diganti ke nama service.
  runner:
    image: oven/bun:1.3-debian
    container_name: spike-runner
    profiles: ["runner"]
    working_dir: /app
    command: ["sleep", "infinity"]
    environment:
      PG_ROOT_URL: postgres://postgres:rootpass@postgres:5432/postgres
      PG_ADMIN_URL: postgres://dbaas_admin:adminpass@postgres:5432/postgres
      MARIADB_ROOT_URL: mysql://root:rootpass@mariadb:3306
      MARIADB_ADMIN_URL: mysql://dbaas_admin:adminpass@mariadb:3306
      MONGO_ROOT_URL: mongodb://root:rootpass@mongo:27017/?authSource=admin
      MONGO_ADMIN_URL: mongodb://dbaas_admin:adminpass@mongo:27017/?authSource=admin
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  mariadata:
  mongodata:
  backups:   # dipakai bersama semua engine: dump ditulis ke file, bukan di-stream
